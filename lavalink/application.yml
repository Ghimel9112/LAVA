server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      mixer: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubeConfig:
      enabled: true
      # Use Piped instances to bypass IP blocks
      pipedInstances:
        - "https://piped.api.kavin.rocks"
        - "https://piped.mha.fi"
        - "https://piped.adminforge.de"
        - "https://piped.kavin.rocks"
      # Fallback to direct if Piped fails (will fail on OceanDigital)
      allowDirect: false
    # Bandcamp requires no special config
    bandcampConfig:
      enabled: true
    soundcloudConfig:
      enabled: true
      # Add client ID if you have one (optional)
      # clientId: "your-soundcloud-client-id"
    # Spotify metadata (requires Lavalink 4+ with source manager)
    # spotifyConfig:
    #   enabled: true
    #   clientId: "your-spotify-client-id"
    #   clientSecret: "your-spotify-client-secret"


metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO

  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000



plugins:
  lavasrc:
    providers: # Custom providers for track loading. This is the default
      - "scsearch:%QUERY%"
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: false # Disabled since it requires premium API
      applemusic: true # Enable Apple Music source as free alternative
      deezer: false # Enable Deezer source
      yandexmusic: false # Enable Yandex Music source
      flow: false # Enable Flow source
      youtube: false # Enable YouTube search source (https://github.com/topi314/LavaSrc#youtube)
    spotify:
      clientId: "ec3cd0ceb75a4170908e7d9f1dc45b6a"
      clientSecret: "a8421e57a937475c813c81103b7271e5"
      countryCode: "US" # the country code you want to use for filtering the artists top tracks. See https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
      playlistLoadLimit: 6 # The number of pages to load for playlists.
      albumLoadLimit: 6 # The number of pages to load for albums.
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - WEB
