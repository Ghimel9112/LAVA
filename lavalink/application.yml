server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      youtube: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      mixer: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubeConfig:
      enabled: true
      # Use Piped instances to bypass IP blocks
      pipedInstances:
        - "https://piped.api.kavin.rocks"
        - "https://piped.mha.fi"
        - "https://piped.adminforge.de"
        - "https://piped.kavin.rocks"
      # Fallback to direct if Piped fails (will fail on OceanDigital)
      allowDirect: false
    # Bandcamp requires no special config
    bandcampConfig:
      enabled: true
    soundcloudConfig:
      enabled: true
      # Add client ID if you have one (optional)
      # clientId: "your-soundcloud-client-id"
    # Spotify metadata (requires Lavalink 4+ with source manager)
    # spotifyConfig:
    #   enabled: true
    #   clientId: "your-spotify-client-id"
    #   clientSecret: "your-spotify-client-secret"

  # Plugin configuration for lavalink-plugin-youtube
  plugins:
    youtube:
      enabled: true
      # Piped instances rotate automatically
      pipedInstances:
        - "https://piped.api.kavin.rocks"
        - "https://piped.mha.fi"
        - "https://piped.adminforge.de"
        - "https://piped.kavin.rocks"
      # Disable direct YouTube connections (blocked on OceanDigital)
      allowDirect: false
      # Quality settings
      preferredQuality: "high"
      # Age gate bypass
      ageGateBypass: true

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: DEBUG