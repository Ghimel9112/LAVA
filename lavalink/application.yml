server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      mixer: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubeConfig:
      enabled: true
      # Use Piped instances to bypass IP blocks
      pipedInstances:
        - "https://piped.api.kavin.rocks"
        - "https://piped.mha.fi"
        - "https://piped.adminforge.de"
        - "https://piped.kavin.rocks"
      # Fallback to direct if Piped fails (will fail on OceanDigital)
      allowDirect: false
    # Bandcamp requires no special config
    bandcampConfig:
      enabled: true
    soundcloudConfig:
      enabled: true
      # Add client ID if you have one (optional)
      clientId: "IPx78YJ43STMUuy4PfGaiGEwNaWfQ4zq"
    # Spotify metadata (requires Lavalink 4+ with source manager)
    # spotifyConfig:
    #   enabled: true
    #   clientId: "your-spotify-client-id"
    #   clientSecret: "your-spotify-client-secret"


metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO

  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000



plugins:
  lavasrc:
    providers: # Minimized YouTube — ISRC lookups first, then text search, YouTube absolute last resort
      - "dzisrc:%ISRC%"          # Deezer by ISRC (exact match, highest priority, direct stream)
      - "dzsearch:%QUERY%"       # Deezer by text query
      - "tidalSearch:%QUERY%"    # Tidal by text query (also resolves ISRC internally)
      - "amsearch:%QUERY%"       # Apple Music by text query
      - "scsearch:%QUERY%"       # SoundCloud by text query
      - "ytsearch:\"%ISRC%\""    # YouTube by ISRC (last resort, only if nothing else matched)
      - "ytsearch:%QUERY%"       # YouTube by text (absolute last resort)
    sources:
      spotify: false       # Disabled — requires Spotify Premium developer account
      applemusic: true     # Apple Music (mirrors via YouTube)
      deezer: true         # Deezer (direct stream — no YouTube dependency)
      tidal: true          # Tidal (mirrors via YouTube, premium-quality catalog)
      yandexmusic: false
      flow: false
      youtube: false
    # spotify: disabled — requires a Spotify Premium account on the developer app owner
    deezer:
